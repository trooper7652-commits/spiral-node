name: Bug
description: Something in Spiral OS, the simulator or the website doesn't work.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: For example "simulator in Firefox 133", "website on a phone", or "Spiral OS on a Raspberry Pi 5".
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the script you were running, or lines from `logs/spiral.log`.
