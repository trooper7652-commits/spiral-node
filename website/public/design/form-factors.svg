<rect width="1560" height="950" fill="#ede3cd"/>
<text x="40" y="52" style="font:700 32px Georgia,serif;fill:#3b2a18">Spiral Node: 5 more form factors</text>
<text x="40" y="80" class="s">Concept sketches · 2026-11-16 · Helix Velocities</text>

<!-- 1 Harmonica bar -->
<g transform="translate(0,100)">
  <rect x="6" y="6" width="508" height="408" rx="14" fill="#f7f1e3" stroke="#d9ccaf"/>
  <circle cx="40" cy="42" r="15" fill="#b87333"/><text x="40" y="48" class="b">1</text>
  <text x="66" y="50" class="t">Harmonica bar</text>
  <text x="28" y="76" class="s">~125 × 38 × 20 mm</text>
  <g filter="url(#sh)"><rect x="72" y="170" width="376" height="114" rx="30" fill="#6b7a3a"/></g>
  <rect x="72" y="170" width="376" height="114" rx="30" fill="url(#gloss)"/>
  <use href="#eink" x="92" y="182"/>
  <use href="#sp3" transform="translate(303,227) scale(11)" stroke="#b87333" stroke-width="2"/>
  <use href="#wheel" transform="translate(388,227) scale(1.05)"/>
  <text x="28" y="400" class="n">Pen-pocket slim; screen and wheel side by side.</text>
</g>

<!-- 2 Snail-shell puck -->
<g transform="translate(520,100)">
  <rect x="6" y="6" width="508" height="408" rx="14" fill="#f7f1e3" stroke="#d9ccaf"/>
  <circle cx="40" cy="42" r="15" fill="#b87333"/><text x="40" y="48" class="b">2</text>
  <text x="66" y="50" class="t">Snail-shell puck</text>
  <text x="28" y="76" class="s">~85 mm across · ~28 mm thick</text>
  <g filter="url(#sh)"><circle cx="260" cy="236" r="138" fill="#6b4a2f"/></g>
  <circle cx="260" cy="236" r="138" fill="url(#gloss)"/>
  <circle cx="260" cy="236" r="130" fill="#4d3522"/>
  <g clip-path="url(#ring)"><use href="#sp10" transform="translate(260,236) scale(130)" stroke="#b87333" stroke-width="2.2"/></g>
  <circle cx="260" cy="236" r="102" fill="#7a5636" stroke="#3b2a18" stroke-width="2"/>
  <use href="#eink" x="175" y="191"/>
  <circle cx="260" cy="116" r="5" fill="#b87333"/>
  <text x="28" y="400" class="n">The rim is the wheel; the logo as a device.</text>
</g>

<!-- 3 Pocket book -->
<g transform="translate(1040,100)">
  <rect x="6" y="6" width="508" height="408" rx="14" fill="#f7f1e3" stroke="#d9ccaf"/>
  <circle cx="40" cy="42" r="15" fill="#b87333"/><text x="40" y="48" class="b">3</text>
  <text x="66" y="50" class="t">Pocket book</text>
  <text x="28" y="76" class="s">~88 × 70 × 21 mm</text>
  <g filter="url(#sh)"><rect x="100" y="118" width="260" height="238" rx="16" fill="#6b4a2f"/></g>
  <rect x="100" y="118" width="260" height="238" rx="16" fill="url(#gloss)"/>
  <rect x="60" y="118" width="76" height="238" rx="24" fill="#3f2c1c"/>
  <rect x="60" y="118" width="76" height="238" rx="24" fill="url(#cyl)"/>
  <line x1="64" y1="152" x2="132" y2="152" stroke="#b87333" stroke-width="3"/>
  <line x1="64" y1="322" x2="132" y2="322" stroke="#b87333" stroke-width="3"/>
  <use href="#eink" x="163" y="134"/>
  <use href="#wheel" transform="translate(248,296)"/>
  <text x="28" y="400" class="n">Spine holds an 18650 cell: about 2× the battery.</text>
</g>

<!-- 4 Locket -->
<g transform="translate(0,520)">
  <rect x="6" y="6" width="508" height="408" rx="14" fill="#f7f1e3" stroke="#d9ccaf"/>
  <circle cx="40" cy="42" r="15" fill="#b87333"/><text x="40" y="48" class="b">4</text>
  <text x="66" y="50" class="t">Locket</text>
  <text x="28" y="76" class="s">pebble + ~4 mm for the lid</text>
  <!-- closed -->
  <g filter="url(#sh)"><rect x="50" y="120" width="150" height="220" rx="62" fill="#26231f"/></g>
  <rect x="50" y="120" width="150" height="220" rx="62" fill="url(#gloss)"/>
  <use href="#sp3" transform="translate(125,232) scale(48)" stroke="#b87333" stroke-width="2" opacity=".85"/>
  <rect x="111" y="116" width="28" height="9" rx="3" fill="#b87333"/>
  <circle cx="125" cy="318" r="5" fill="#b87333"/>
  <text x="125" y="364" class="l" text-anchor="middle">closed</text>
  <text x="260" y="238" style="font:700 34px Georgia,serif;fill:#b87333" text-anchor="middle">→</text>
  <!-- open -->
  <rect x="320" y="104" width="150" height="206" rx="62" fill="#55632d"/>
  <g filter="url(#sh)"><rect x="320" y="140" width="150" height="220" rx="62" fill="#26231f"/></g>
  <rect x="320" y="140" width="150" height="220" rx="62" fill="url(#gloss)"/>
  <rect x="381" y="136" width="28" height="9" rx="3" fill="#b87333"/>
  <use href="#eink" transform="translate(328.7,166) scale(.78)"/>
  <use href="#wheel" transform="translate(395,300) scale(.8)"/>
  <text x="395" y="380" class="l" text-anchor="middle">open</text>
  <text x="28" y="400" class="n">Screen protected in a pocket; closing could sleep it.</text>
</g>

<!-- 5 Standing stone -->
<g transform="translate(520,520)">
  <rect x="6" y="6" width="508" height="408" rx="14" fill="#f7f1e3" stroke="#d9ccaf"/>
  <circle cx="40" cy="42" r="15" fill="#b87333"/><text x="40" y="48" class="b">5</text>
  <text x="66" y="50" class="t">Standing stone</text>
  <text x="28" y="76" class="s">~72 × 105 × 20–24 mm, flat foot</text>
  <line x1="30" y1="358" x2="500" y2="358" stroke="#8a7656" stroke-width="2"/>
  <!-- front -->
  <g filter="url(#sh)"><path d="M120,108 H150 A60,60 0 0 1 210,168 V344 A14,14 0 0 1 196,358 H74 A14,14 0 0 1 60,344 V168 A60,60 0 0 1 120,108 Z" fill="#6b4a2f"/></g>
  <path d="M120,108 H150 A60,60 0 0 1 210,168 V344 A14,14 0 0 1 196,358 H74 A14,14 0 0 1 60,344 V168 A60,60 0 0 1 120,108 Z" fill="url(#gloss)"/>
  <use href="#eink" transform="translate(68.7,134) scale(.78)"/>
  <use href="#wheel" transform="translate(135,275) scale(.8)"/>
  <text x="135" y="380" class="l" text-anchor="middle">front</text>
  <!-- side, leaning back -->
  <g clip-path="url(#aboveDesk)">
    <g transform="rotate(14 349 358)">
      <rect x="320" y="108" width="58" height="300" rx="26" fill="#6b4a2f"/>
      <rect x="320" y="108" width="58" height="300" rx="26" fill="url(#gloss)"/>
      <rect x="321" y="132" width="6" height="92" rx="2" fill="#ebe8da" stroke="#22201c"/>
    </g>
  </g>
  <path d="M410,114 C414,90 440,80 456,94" fill="none" stroke="#26231f" stroke-width="5" stroke-linecap="round"/>
  <text x="504" y="80" class="l" text-anchor="end" style="fill:#8a5524">USB-C cable sticks up</text>
  <text x="404" y="336" class="l">≈14° lean</text>
  <text x="380" y="380" class="l" text-anchor="middle">side</text>
  <text x="28" y="400" class="n">Nearly free; a desk glance-clock for timed scripts.</text>
</g>

<!-- legend -->
<g transform="translate(1040,520)">
  <rect x="6" y="6" width="508" height="408" rx="14" fill="#f7f1e3" stroke="#d9ccaf"/>
  <text x="28" y="50" class="t">Shared by all five</text>
  <text x="28" y="96" style="font:16px 'Segoe UI',Arial,sans-serif;fill:#3b2a18">• 250 × 122 e-ink, wide page-margin border</text>
  <text x="28" y="128" style="font:16px 'Segoe UI',Arial,sans-serif;fill:#3b2a18">• Spiral wheel = up / down / left / right + press</text>
  <text x="28" y="160" style="font:16px 'Segoe UI',Arial,sans-serif;fill:#3b2a18">• Brown, black, olive with a copper accent</text>
